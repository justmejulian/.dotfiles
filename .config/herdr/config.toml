onboarding = false

[theme]
# Catppuccin Mocha, matching Ghostty and Neovim.
name = "catppuccin"

[theme.custom]
# Highlight the active Space and focused Agent against the dark sidebar.
active_row_bg = "#263450"

[ui.toast]
delivery = "terminal"

# PR number, checks and review per workspace from the alx-xo.pr-status plugin
# (herdr plugin install alx-xo/herdr-pr-status; settings in
# ~/.config/herdr/plugins/config/alx-xo.pr-status/config.json).
# $num is the workspace number for ctrl+1..9, published by
# local-plugins/workspace-setup/numbers.sh.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$num", fg = "#6c7086" }, "workspace"],
  ["branch", "git_status"],
  [
    { token = "$pr", fg = "#6c7086" },
    { token = "$pr_checks", fg = "#f9e2af", rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "✗", fg = "#f38ba8" },
    ] },
    { token = "$pr_review", fg = "#f9e2af", rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "∆", fg = "#f38ba8" },
      { equals = "review ?", fg = "#6c7086" },
    ] },
  ],
]

# Cmd pane navigation leaves Ctrl+H/J/K/L available to Neovim.
[keys]
focus_pane_left = "cmd+h"
focus_pane_down = "cmd+j"
focus_pane_up = "cmd+k"
focus_pane_right = "cmd+l"
next_agent = "ctrl+]"
previous_agent = "ctrl+["

# herdr-nvim (herdr plugin install ChmaraX/herdr-nvim). Custom commands are read
# from the server config, so they live here, not in app.toml.
[[keys.command]]
key = "cmd+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "cmd+shift+p"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# abtop (brew install abtop) in a floating popup. Jumping to a session from it
# doesn't work in herdr; use cmd+o (goto) for that.
[[keys.command]]
key = "cmd+u"
type = "popup"
command = "abtop"
width = "70%"
height = "50%"
description = "abtop"

# New workspace in a repo under ~/Documents/git
# (~/.config/herdr/local-plugins/workspace-setup/pick-repo).
[[keys.command]]
key = "cmd+shift+n"
type = "popup"
command = "$HOME/.config/herdr/local-plugins/workspace-setup/pick-repo"
description = "new workspace in repo"
width = "50%"
height = "40%"

# Command palette (herdr plugin install vjeantet/herdr-palette): built-in
# operations, plugin actions and own commands from
# ~/.config/herdr/plugins/config/vjeantet.palette/config.toml.
[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "vjeantet.palette.open"
description = "command palette"
