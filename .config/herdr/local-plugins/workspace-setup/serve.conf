# Serve steps per repo, run in the "serve" tab of every new workspace.
# Matched on the repo name, so worktrees of a repo use the same steps.
# Repos not listed get no serve tab.
#
# <repo> = <command>
#
# Each line is one step. run-steps.zsh runs them in order in the tab's zsh,
# stopping at the first failure, and adds each to the shell history as its own
# entry: stop the server and press up/enter to rerun just the last step.
#
# app: RUSTUP_TOOLCHAIN is unset so rustup uses the toolchain pinned in the
# repo's rust-toolchain.toml, which has the wasm32-wasip1 target. yarn
# rust:build builds the Wasm modules into target/app-wasm, which typecheck and
# Jest import. free-port prints the first free port from 8080 up; it runs after
# yarn install so workspaces created together don't pick the same port.
app = unset RUSTUP_TOOLCHAIN
app = yarn install
app = yarn rust:build
app = yarn web serve --port $(~/.config/herdr/local-plugins/workspace-setup/free-port 8080)
