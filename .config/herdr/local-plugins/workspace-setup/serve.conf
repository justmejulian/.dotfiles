# Serve command per repo, run in the "serve" tab of every new workspace.
# Matched on the repo name, so worktrees of a repo use the same command.
# Repos not listed get no serve tab.
#
# <repo> = <command>
#
# free-port prints the first free port from 8080 up. It runs after yarn install
# so workspaces created together don't pick the same port.
app = yarn install && yarn web serve --port $(~/.config/herdr/local-plugins/workspace-setup/free-port 8080)
