onboarding = false

[theme]
# Catppuccin Mocha, matching Ghostty and Neovim.
name = "catppuccin"

[ui]
# Agents waiting on me first in the sidebar.
agent_panel_sort = "priority"

status_indicators = "dots"
[ui.toast]
delivery = "terminal"

# PR number, checks and review per workspace from the alx-xo.pr-status plugin
# (herdr plugin install alx-xo/herdr-pr-status; settings in
# ~/.config/herdr/plugins/config/alx-xo.pr-status/config.json).
# $num is the workspace number for ctrl+1..9, published by
# local-plugins/workspace-setup/numbers.sh.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$num", fg = "#6c7086" }, "workspace"],
  ["branch", "git_status"],
  [
    { token = "$pr", fg = "#6c7086" },
    { token = "$pr_checks", fg = "#f9e2af", rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "✗", fg = "#f38ba8" },
    ] },
    { token = "$pr_review", fg = "#f9e2af", rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "∆", fg = "#f38ba8" },
      { equals = "review ?", fg = "#6c7086" },
    ] },
  ],
]

# Keybindings for Herdr.app only: its client runs with HERDR_CONFIG_PATH pointing
# here (~/.config/appify/herdr.conf), and herdr.ghostty unbinds these cmd chords
# in Ghostty so they reach herdr directly. Keybindings are client-side, so other
# terminals keep the defaults from config.toml.
#
# Herdr catches these keys before the pane sees them. Before adding or changing
# a binding, check it is not used by Claude Code, Codex, Neovim
# (~/.config/nvim, e.g. <D-c> and <D-s> in lua/config/keymaps.lua) or tuicr.
[keys]
goto = "cmd+o"
new_worktree = "cmd+n"
rename_workspace = "cmd+shift+r"
next_workspace = "ctrl+tab"
previous_workspace = "ctrl+shift+tab"

new_tab = "cmd+t"
rename_tab = "cmd+r"
close_tab = "cmd+w"
next_tab = "cmd+shift+]"
previous_tab = "cmd+shift+["
switch_tab = "cmd+1..9"
switch_workspace = "ctrl+1..9"

split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane = "cmd+shift+w"
zoom = "cmd+shift+enter"
toggle_sidebar = "cmd+b"
focus_pane_left = "cmd+alt+h"
focus_pane_down = "cmd+alt+j"
focus_pane_up = "cmd+alt+k"
focus_pane_right = "cmd+alt+l"

next_agent = "cmd+]"
previous_agent = "cmd+["
open_notification_target = "cmd+;"
