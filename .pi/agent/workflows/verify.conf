# Checks the develop workflow's verify step runs before the final review.
# Matched on the repo name, so worktrees of a repo use the same line.
# implement/refine/develop block when a repo is not listed.
# The legacy address-feedback verifier still skips unconfigured repos.
#
# <repo> = <command, run with bash -lc in the repo root>
app = yarn fmt:check && yarn lint && yarn tsc:all && yarn test
pi-workflow-e2e = npm run lint && npm test
